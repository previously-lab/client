name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # TEMPORARY (pre-release): pnpm-workspace.yaml pins @previously-lab/kernel
      # to a local path that only exists on maintainer machines. Strip it in CI
      # and skip the frozen lockfile until @previously-lab/kernel is published
      # and the override file is removed from the repo (then restore
      # `pnpm install --frozen-lockfile`).
      - run: node -e "fs.rmSync('pnpm-workspace.yaml', { force: true })"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test
