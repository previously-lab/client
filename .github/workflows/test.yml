name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # TEMPORARY (pre-release): pnpm-workspace.yaml pins previously-kernel to
      # a local path that only exists on maintainer machines. Strip it in CI
      # and skip the frozen lockfile until previously-kernel is published and
      # the override file is removed from the repo (then restore
      # `pnpm install --frozen-lockfile`).
      - run: rm -f pnpm-workspace.yaml
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test
